<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المقرأة — حجز مواعيد الحضور</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16333A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المقرأة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16333A;
    --ink-soft:#3E5C5C;
    --paper:#F1ECDF;
    --paper-deep:#E7DFC9;
    --gold:#B8923F;
    --gold-light:#E4C77A;
    --clay:#8B4A3D;
    --sage:#4C7A64;
    --sage-light:#E4EEE7;
    --clay-light:#F3E5E1;
    --font-display:'Aref Ruqaa', serif;
    --font-body:'Tajawal', sans-serif;
    --radius:14px;
    --shadow:0 6px 24px rgba(22,51,58,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(184,146,63,0.08), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(22,51,58,0.06), transparent 45%);
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 18px 60px;}

  /* ---------- Header ---------- */
  header.app-head{
    text-align:center;
    padding:38px 16px 26px;
    position:relative;
    perspective:600px;
  }
  .star-mark{
    width:72px; height:72px; margin:0 auto 10px;
    animation:flip-slow 7s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){ .star-mark{animation:none;} }
  @keyframes flip-slow{ 0%,100%{transform:rotateY(0deg);} 50%{transform:rotateY(180deg);} }
  .app-head h1{
    font-family:var(--font-display);
    font-size:2.5rem;
    font-weight:700;
    color:var(--ink);
    line-height:1.15;
  }
  .app-head p.desc{
    color:var(--ink-soft);
    font-size:0.98rem;
    margin-top:8px;
    max-width:440px;
    margin-inline:auto;
  }
  .divider{
    height:14px; margin:22px auto 0; max-width:280px;
    background-image: repeating-linear-gradient(90deg, transparent 0 6px, var(--gold-light) 6px 7px, transparent 7px 26px);
    opacity:0.7;
  }
  .my-bookings-btn{ margin-top:16px; }
  .header-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .header-actions .my-bookings-btn{ margin-top:0; }
  .install-btn{ animation:pulse-glow 2.4s ease-in-out infinite; }
  @keyframes pulse-glow{ 0%,100%{ box-shadow:0 3px 10px rgba(184,146,63,0.35); } 50%{ box-shadow:0 3px 16px rgba(184,146,63,0.7); } }
  @media (prefers-reduced-motion:reduce){ .install-btn{ animation:none; } }

  /* ---------- Cards / board ---------- */
  .board{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    border:1px solid var(--paper-deep);
  }
  .day-group{ border-bottom:1px solid var(--paper-deep); }
  .day-group:last-child{ border-bottom:none; }
  .day-label{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-display);
    font-size:1.15rem;
    padding:10px 18px;
    letter-spacing:.3px;
  }
  .slot-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    gap:12px;
    border-top:1px dashed var(--paper-deep);
  }
  .day-group .slot-row:first-of-type{ border-top:none; }
  .slot-time{
    font-weight:700; font-size:1.05rem; color:var(--ink);
    min-width:118px;
  }
  .slot-note{ color:var(--ink-soft); font-size:0.85rem; margin-top:2px; }
  .slot-main{ flex:1; }
  .btn{
    font-family:var(--font-body);
    border:none; cursor:pointer;
    border-radius:999px;
    font-weight:700;
    font-size:0.92rem;
    padding:9px 20px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-primary{ background:var(--gold); color:#fff; box-shadow:0 3px 10px rgba(184,146,63,0.35); }
  .btn-secondary{ background:var(--paper-deep); color:var(--ink); }
  .btn-danger{ background:var(--clay-light); color:var(--clay); }
  .btn-outline{ background:transparent; border:1.5px solid var(--ink-soft); color:var(--ink-soft); }
  .btn-sm{ padding:6px 14px; font-size:0.8rem; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }

  .tag{
    display:inline-block; font-size:0.75rem; font-weight:700;
    padding:3px 10px; border-radius:999px;
  }
  .tag-avail{ background:var(--sage-light); color:var(--sage); }
  .tag-booked{ background:var(--clay-light); color:var(--clay); }
  .tag-full{ background:var(--clay-light); color:var(--clay); }

  .seat-mini{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .seat-mini .dots{ display:flex; gap:4px; }
  .seat-mini .dot{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--gold); background:transparent; }
  .seat-mini .dot.filled{ background:var(--gold); }
  .seat-mini .count{ font-size:0.78rem; color:var(--ink-soft); }

  .roster-list{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .roster-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--sage-light); border-radius:8px; padding:6px 10px; font-size:0.82rem;
  }
  .roster-item .name{ font-weight:700; color:var(--ink); }
  .roster-item .roster-info{ flex:1; min-width:0; }
  .roster-item .roster-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .call-btn{
    display:flex; align-items:center; justify-content:center; width:26px; height:26px;
    border-radius:50%; background:var(--gold); color:#fff; text-decoration:none; font-size:13px;
    flex-shrink:0;
  }

  /* ---------- Admin dropdown menu ---------- */
  .admin-menu-wrap{ position:relative; }
  .admin-menu-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; background:#fff; border:1px solid var(--paper-deep);
    border-radius:10px; box-shadow:0 8px 24px rgba(22,51,58,0.18); min-width:190px; z-index:30;
    overflow:hidden; display:none;
  }
  .admin-menu-dropdown.open{ display:block; }
  .admin-menu-item{
    display:block; width:100%; text-align:right; padding:11px 14px; background:none; border:none;
    border-bottom:1px solid var(--paper-deep); font-family:var(--font-body); font-size:0.86rem;
    color:var(--ink); cursor:pointer;
  }
  .admin-menu-item:last-child{ border-bottom:none; }
  .admin-menu-item:active{ background:var(--sage-light); }

  /* ---------- Chat ---------- */
  .chat-wrap{ display:flex; flex-direction:column; height:calc(100vh - 220px); min-height:340px; }
  .chat-messages{
    flex:1; overflow-y:auto; padding:14px; background:#fff; border:1px solid var(--paper-deep);
    border-radius:var(--radius) var(--radius) 0 0; display:flex; flex-direction:column; gap:8px;
  }
  .msg-bubble{
    position:relative; max-width:78%; padding:9px 13px; border-radius:14px; font-size:0.9rem; line-height:1.5;
    word-wrap:break-word; white-space:pre-wrap;
  }
  .msg-bubble .msg-time{ display:block; font-size:0.68rem; opacity:0.65; margin-top:4px; }
  .msg-student{ align-self:flex-start; background:var(--sage-light); color:var(--ink); border-bottom-left-radius:4px; }
  .msg-teacher{ align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px; }
  .msg-delete-btn{
    position:absolute; top:-8px; left:-8px; width:20px; height:20px; border-radius:50%;
    border:none; background:var(--clay); color:#fff; font-size:13px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .chat-input-row{
    display:flex; gap:8px; padding:10px; background:#fff; border:1px solid var(--paper-deep); border-top:none;
    border-radius:0 0 var(--radius) var(--radius);
  }
  .chat-input-row input{ flex:1; }
  .chat-empty{ color:var(--ink-soft); text-align:center; margin-top:20px; font-size:0.88rem; }
  .chat-list-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--paper-deep); border-radius:12px; padding:12px 14px;
    margin-bottom:10px; cursor:pointer;
  }
  .chat-list-item .cl-name{ font-weight:700; color:var(--ink); }
  .chat-list-item .cl-preview{ font-size:0.82rem; color:var(--ink-soft); margin-top:2px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .unread-dot{
    width:10px; height:10px; border-radius:50%; background:var(--clay); flex-shrink:0;
  }
  .chat-badge{
    background:var(--clay); color:#fff; font-size:0.7rem; font-weight:700;
    border-radius:10px; padding:1px 7px; margin-inline-start:4px;
  }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty-state svg{ width:56px; height:56px; opacity:0.35; margin-bottom:12px; }

  /* ---------- Footer link ---------- */
  .foot-link{
    text-align:center; margin-top:30px;
  }
  .foot-link button{
    background:none; border:none; color:var(--ink-soft);
    font-family:var(--font-body); font-size:0.82rem;
    text-decoration:underline; cursor:pointer; opacity:0.75;
  }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(22,51,58,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; padding:0;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @media (min-width:520px){ .modal-backdrop{ align-items:center; } }
  .modal{
    background:var(--paper); width:100%; max-width:440px;
    border-radius:20px 20px 0 0;
    padding:26px 22px 30px;
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
  }
  @media (min-width:520px){ .modal{ border-radius:20px; } }
  .modal h3{
    font-family:var(--font-display); font-size:1.5rem; margin-bottom:4px;
  }
  .modal .sub{ color:var(--ink-soft); font-size:0.88rem; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px; color:var(--ink); }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 14px; border-radius:10px;
    border:1.5px solid var(--paper-deep); background:#fff;
    font-family:var(--font-body); font-size:0.95rem; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--gold);
  }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn{ flex:1; }
  .err-msg{ color:var(--clay); font-size:0.85rem; margin-top:-6px; margin-bottom:12px; display:none; }

  /* ---------- Admin ---------- */
  .admin-topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; padding-top:20px; flex-wrap:wrap; gap:10px;
  }
  .admin-topbar h2{ font-family:var(--font-display); font-size:1.6rem; }
  .section-title{
    font-family:var(--font-display); font-size:1.25rem; margin:26px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .admin-card{
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px; border:1px solid var(--paper-deep);
  }
  .row-2{ display:flex; gap:10px; }
  .row-2 .field{ flex:1; }
  .login-wrap{
    max-width:340px; margin:60px auto; text-align:center;
    perspective:600px;
  }
  .login-wrap .star-mark{ width:52px; height:52px; }
  .login-wrap h2{ font-family:var(--font-display); font-size:1.6rem; margin-bottom:6px; }
  .login-wrap .sub{ color:var(--ink-soft); font-size:0.88rem; margin-bottom:22px; }
  .pin-input{
    width:100%; text-align:center; letter-spacing:10px; font-size:1.5rem;
    padding:14px; border-radius:10px; border:1.5px solid var(--paper-deep);
    font-family:var(--font-body); font-weight:700; color:var(--ink);
  }
  .pin-input:focus{ outline:none; border-color:var(--gold); }

  .admin-slot{
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:14px 0; border-top:1px dashed var(--paper-deep); gap:10px;
  }
  .admin-slot:first-child{ border-top:none; }
  .admin-slot .meta{ font-size:0.82rem; color:var(--ink-soft); margin-top:4px; }
  .admin-slot .actions{ display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .booked-by{ font-weight:700; color:var(--clay); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:999px;
    font-size:0.9rem; box-shadow:0 6px 18px rgba(0,0,0,0.25); z-index:100;
    animation:toastIn .2s ease;
  }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)} }

  .confirm-screen{
    text-align:center; padding:60px 20px;
  }
  .confirm-screen svg{ width:64px; height:64px; color:var(--sage); margin-bottom:16px; }
  .confirm-screen h2{ font-family:var(--font-display); font-size:1.8rem; margin-bottom:8px; }
  .confirm-screen p{ color:var(--ink-soft); }
  .loading{ text-align:center; padding:80px 20px; color:var(--ink-soft); }
  .config-warning{
    max-width:520px; margin:40px auto; background:#fff; border:1.5px solid var(--clay);
    border-radius:var(--radius); padding:22px; text-align:center; color:var(--ink);
  }
  .config-warning h2{ font-family:var(--font-display); color:var(--clay); margin-bottom:8px; }
  .config-warning code{ background:var(--paper-deep); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<!-- Firebase (تخزين مجاني حقيقي يشتغل بعد رفع الموقع على أي استضافة، بما فيها GitHub Pages) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<div class="wrap" id="app"></div>

<script>
const STORAGE_KEY = 'meqraa-data';
const MAX_SEATS = 4;
const SLOT_MINUTES = 60;
const TEACHER_HASH = '#teacher';

/* ====== إعدادات Firebase ======
   استبدل القيم دي بالقيم اللي هتاخدها من مشروعك على Firebase
   (Project settings > عام > تطبيقاتك > Web app > firebaseConfig).
   لو سبتها زي ما هي، الموقع هيوقف ويوريك رسالة توضح إنك محتاج تظبطها. */
const firebaseConfig = {
  apiKey: "AIzaSyDM0y-5QcKtAaG4RDkjrDFIVKCbf8JQLv8",
  authDomain: "meqra-d7de8.firebaseapp.com",
  projectId: "meqra-d7de8",
  storageBucket: "meqra-d7de8.firebasestorage.app",
  messagingSenderId: "288351239358",
  appId: "1:288351239358:web:139d45509e7e15030532ef"
};
const FIRESTORE_COLLECTION = 'meqraa';
const FIRESTORE_DOC = 'data';
const CHATS_COLLECTION = 'meqraa_chats';

let db = null;
let unsubscribeSnapshot = null;
let chatUnsub = null;
function isConfigMissing(){
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('ضع-') !== -1;
}
/* ---------------- تثبيت التطبيق (زرار تحميل سريع) ---------------- */
let deferredInstallPrompt = null;
let canInstallApp = false;
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const isStandaloneAlready = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  canInstallApp = true;
  if(state.view === 'student') render();
});
window.addEventListener('appinstalled', () => {
  canInstallApp = false;
  deferredInstallPrompt = null;
  if(state.view === 'student') render();
});

function notifButtonHtml(){
  if(!('Notification' in window)) return '';
  if(Notification.permission === 'granted' || Notification.permission === 'denied') return '';
  return `<button class="btn btn-outline btn-sm my-bookings-btn" onclick="requestNotifPermission()">🔔 فعّل تنبيهات المواعيد</button>`;
}

function requestNotifPermission(){
  if(!('Notification' in window)){
    showToast('للأسف متصفحك (أو آيفون) لا يدعم هذا النوع من التنبيهات');
    return;
  }
  Notification.requestPermission().then((perm)=>{
    if(perm === 'granted'){
      showToast('تم تفعيل التنبيهات، هتوصلك وأنت فاتح الموقع');
    }else{
      showToast('تم رفض الإذن، تقدر تفعّله لاحقًا من إعدادات الموقع في المتصفح');
    }
    if(state.view === 'student') render();
  });
}

function notifyIfNewSlots(oldData, newData){
  if(!oldData || !oldData.slots || !newData || !newData.slots) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const oldIds = new Set(oldData.slots.map(s=>s.id));
  const added = newData.slots.filter(s => !oldIds.has(s.id) && !isSlotPast(s));
  added.forEach((s)=>{
    try{
      new Notification('ميعاد جديد في ' + ((newData.info && newData.info.name) || 'المقرأة'), {
        body: fmtDate(s.date) + ' - ' + fmtTime(s.time),
        icon: 'icon-192.png'
      });
    }catch(e){}
  });
}

async function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    canInstallApp = false;
    render();
    return;
  }
  if(isIOS){
    showToast('من قائمة المشاركة 🔲⬆️ تحت، اختر "إضافة إلى الشاشة الرئيسية"');
  }else{
    showToast('من قائمة المتصفح ⋮ فوق، اختر "إضافة إلى الشاشة الرئيسية" أو "تثبيت التطبيق"');
  }
}

function installButtonHtml(){
  if(isStandaloneAlready) return '';
  return `<button class="btn btn-primary btn-sm install-btn" onclick="installApp()">⬇ تثبيت التطبيق</button>`;
}

let state = {
  view: 'student', // student | confirm | adminLogin | adminSetup | admin
  data: null,
  loading: true,
  selectedSlot: null,
  lastBooking: null,
  pinAttemptError: false,
  myBookingsEmail: '',
  myBookingsResults: null,
  chatEmail: '',
  chatName: '',
  chatMessages: null,
  chatList: [],
  chatUnreadTotal: 0,
  activeChatEmail: null,
  activeChatName: '',
  activeChatMessages: [],
  adminMenuOpen: false,
  notifyMessage: '',
};

const starSVG = `<svg class="star-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#B8923F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 22 C36 16 20 18 10 26 L10 76 C20 68 36 66 50 72 Z"/>
    <path d="M50 22 C64 16 80 18 90 26 L90 76 C80 68 64 66 50 72 Z"/>
    <line x1="50" y1="22" x2="50" y2="72"/>
    <path d="M18 34 L42 38"/>
    <path d="M18 44 L42 48"/>
    <path d="M18 54 L42 58"/>
    <path d="M58 38 L82 34"/>
    <path d="M58 48 L82 44"/>
    <path d="M58 58 L82 54"/>
  </g>
</svg>`;

function defaultData(){
  return { info: { name: 'المقرأة', desc: 'سجّل حضورك في الوقت المناسب لك' }, pin: null, slots: [] };
}

function renderConfigWarning(){
  document.getElementById('app').innerHTML = `
    <div class="config-warning">
      <h2>الموقع محتاج إعداد Firebase الأول</h2>
      <p>افتح ملف الصفحة وحط بيانات مشروعك في <code>firebaseConfig</code> بدل القيم اللي بتبدأ بـ "ضع-".</p>
    </div>`;
}

async function loadData(){
  if(isConfigMissing()){
    state.loading = false;
    renderConfigWarning();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    const docRef = db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC);
    const snap = await docRef.get();
    state.data = snap.exists ? snap.data() : defaultData();
    if(!snap.exists){ await docRef.set(state.data); }

    // تحديث فوري على كل الأجهزة لحظة حدوث أي حجز أو تعديل
    unsubscribeSnapshot = docRef.onSnapshot((doc)=>{
      if(!doc.exists) return;
      const newData = doc.data();
      notifyIfNewSlots(state.data, newData);
      state.data = newData;
      if(state.view === 'student' || state.view === 'admin'){ render(); }
    }, (err)=>{ console.error(err); });
  }catch(e){
    console.error(e);

let toastTimer = null;
function showToast(msg){
  clearTimeout(toastTimer);
  let el = document.getElementById('toast');
  if(el) el.remove();
  el = document.createElement('div');
  el.id = 'toast';
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(()=>{ el.remove(); }, 2600);
}

function fmtDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ar-EG', { weekday:'long', day:'numeric', month:'long' });
}
function fmtTime(timeStr){
  const [h,m] = timeStr.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  return d.toLocaleTimeString('ar-EG', { hour:'numeric', minute:'2-digit', hour12:true });
}
function addMinutes(timeStr, mins){
  const [h,m] = timeStr.split(':').map(Number);
  const d = new Date(); d.setHours(h,m,0,0);
  d.setMinutes(d.getMinutes()+Number(mins));
  return d.toTimeString().slice(0,5);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function upcomingSlots(){
  return state.data.slots
    .filter(s => !isSlotPast(s))
    .sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
}

function isSlotPast(s){
  const end = new Date(s.date + 'T' + s.time + ':00').getTime() + SLOT_MINUTES * 60000;
  return end <= Date.now();
}

function groupByDate(slots){
  const groups = {};
  slots.forEach(s=>{
    if(!groups[s.date]) groups[s.date]=[];
    groups[s.date].push(s);
  });
  return groups;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function searchMyBookings(){
  const raw = document.getElementById('myEmailInput').value.trim().toLowerCase();
  if(!raw) return;
  state.myBookingsEmail = raw;
  try{ localStorage.setItem('meqraaMyEmail', raw); }catch(e){}

  const now = Date.now();
  const upcoming = [];
  const past = [];
  (state.data.slots || []).forEach(s=>{
    (s.bookings || []).forEach(b=>{
      if((b.email || '').toLowerCase() === raw){
        const start = new Date(s.date + 'T' + s.time + ':00').getTime();
        const end = start + SLOT_MINUTES * 60000;
        const item = { slot: s, booking: b, start, end };
        if(end > now) upcoming.push(item); else past.push(item);
      }
    });
  });
  upcoming.sort((a,b)=>a.start - b.start);
  past.sort((a,b)=>b.start - a.start);
  state.myBookingsResults = { upcoming, past };
  render();
}

function formatCountdown(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const days = Math.floor(totalSec/86400);
  const hours = Math.floor((totalSec % 86400)/3600);
  const mins = Math.floor((totalSec % 3600)/60);
  const secs = totalSec % 60;
  const parts = [];
  if(days) parts.push(days+' يوم');
  if(hours || days) parts.push(hours+' ساعة');
  if(mins || hours || days) parts.push(mins+' دقيقة');
  parts.push(secs+' ثانية');
  return 'متبقي ' + parts.join(' و ');
}

function updateMyBookingsCountdowns(){
  if(!state.myBookingsResults) return;
  const now = Date.now();
  let anyStateChange = false;
  state.myBookingsResults.upcoming.forEach(item=>{
    const el = document.getElementById('cd-'+item.booking.id);
    if(!el) return;
    if(now >= item.end){
      anyStateChange = true;
    }else if(now >= item.start){
      el.textContent = 'الموعد جارٍ الآن';
      el.className = 'tag tag-full';
    }else{
      el.textContent = formatCountdown(item.start - now);
    }
  });
  if(anyStateChange){
    // موعد انتهى بينما الصفحة مفتوحة - أعد الحساب لنقله لقسم "السابقة"
    searchMyBookings();
  }
}

function startMyBookingsTimer(){
  stopMyBookingsTimer();
  updateMyBookingsCountdowns();
  myBookingsTimer = setInterval(updateMyBookingsCountdowns, 1000);
}
function stopMyBookingsTimer(){
  if(myBookingsTimer){ clearInterval(myBookingsTimer); myBookingsTimer = null; }
}

/* ---------------- CHAT (محادثة ثنائية بين كل طالب والمعلم) ---------------- */
let chatListUnsub = null;
let chatThreadUnsub = null;

function fmtMsgTime(iso){
  try{
    return new Date(iso).toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
  }catch(e){ return ''; }
}

function stopChatThread(){
  if(chatThreadUnsub){ chatThreadUnsub(); chatThreadUnsub = null; }
}
function stopAdminChatList(){
  if(chatListUnsub){ chatListUnsub(); chatListUnsub = null; }
  state.chatList = [];
  state.chatUnreadTotal = 0;
}

function goStudentChat(){
  stopMyBookingsTimer();
  const savedEmail = (localStorage.getItem('meqraaMyEmail') || '').trim();
  const savedName = (localStorage.getItem('meqraaMyName') || '').trim();
  state.view = 'chat';
  state.chatEmail = savedEmail;
  state.chatName = savedName;
  state.chatMessages = null;
  render();
  if(savedEmail){ subscribeStudentChat(savedEmail); }
}

function goStudentChatBack(){
  stopChatThread();
  backToStudent();
}

function submitChatIdentity(){
  const name = document.getElementById('chatNameInput').value.trim();
  const email = document.getElementById('chatEmailInput').value.trim().toLowerCase();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const err = document.getElementById('chatIdErr');
  if(!name || !emailOk){
    if(err) err.style.display = 'block';
    return;
  }
  state.chatName = name;
  state.chatEmail = email;
  try{
    localStorage.setItem('meqraaMyEmail', email);
    localStorage.setItem('meqraaMyName', name);
  }catch(e){}
  render();
  subscribeStudentChat(email);
}

function subscribeStudentChat(email){
  stopChatThread();
  const docRef = db.collection(CHATS_COLLECTION).doc(email);
  chatThreadUnsub = docRef.onSnapshot((doc)=>{
    const d = doc.exists ? doc.data() : {};
    state.chatMessages = d.messages || [];
    if(d.unreadByStudent){
      docRef.set({ unreadByStudent: false }, { merge:true }).catch(()=>{});
    }
    if(state.view === 'chat') render();
  }, ()=>{ state.chatMessages = []; render(); });
}

function sendStudentMessage(){
  const input = document.getElementById('chatInputStudent');
  const text = input.value.trim();
  if(!text || !state.chatEmail) return;
  const msg = { id: uid(), from:'student', text, at: new Date().toISOString() };
  db.collection(CHATS_COLLECTION).doc(state.chatEmail).set({
    studentName: state.chatName,
    studentEmail: state.chatEmail,
    messages: firebase.firestore.FieldValue.arrayUnion(msg),
    lastMessageAt: msg.at,
    lastMessageFrom: 'student',
    lastMessageText: text,
    unreadByTeacher: true,
    unreadByStudent: false
  }, { merge:true }).catch(()=>{ showToast('تعذر إرسال الرسالة، حاول تاني'); });
  input.value = '';
}

function deleteStudentMessage(msgId){
  if(!confirm('حذف الرسالة دي؟')) return;
  const filtered = (state.chatMessages || []).filter(m=>m.id !== msgId);
  const last = filtered[filtered.length - 1];
  db.collection(CHATS_COLLECTION).doc(state.chatEmail).set({
    messages: filtered,
    lastMessageAt: last ? last.at : new Date().toISOString(),
    lastMessageFrom: last ? last.from : null,
    lastMessageText: last ? last.text : ''
  }, { merge:true }).catch(()=>{ showToast('تعذر حذف الرسالة'); });
}

function chatBubblesHtml(messages, viewerRole){
  if(!messages || !messages.length){
    return `<div class="chat-empty">مفيش رسائل لسه، ابدأ المحادثة 👋</div>`;
  }
  const deleteFn = viewerRole === 'teacher' ? 'deleteTeacherMessage' : 'deleteStudentMessage';
  return messages.map(m=>`
    <div class="msg-bubble ${m.from === 'teacher' ? 'msg-teacher' : 'msg-student'}">
      ${m.from === viewerRole ? `<button class="msg-delete-btn" onclick="${deleteFn}('${m.id}')" title="حذف الرسالة">×</button>` : ''}
      ${escapeHtml(m.text)}
      <span class="msg-time">${fmtMsgTime(m.at)}</span>
    </div>
  `).join('');
}

function renderStudentChat(app){
  if(!state.chatEmail){
    app.innerHTML = `
      <header class="app-head">
        ${starSVG}
        <h1>راسل المعلم</h1>
        <div class="divider"></div>
        <button class="btn btn-outline btn-sm" onclick="goStudentChatBack()">رجوع للمواعيد</button>
      </header>
      <div class="admin-card">
        <div class="field">
          <label for="chatNameInput">اسمك</label>
          <input id="chatNameInput" type="text" value="${escapeAttr(localStorage.getItem('meqraaMyName')||'')}" placeholder="اكتب اسمك">
        </div>
        <div class="field">
          <label for="chatEmailInput">بريدك الإلكتروني</label>
          <input id="chatEmailInput" type="email" value="${escapeAttr(localStorage.getItem('meqraaMyEmail')||'')}" placeholder="example@email.com">
        </div>
        <div class="err-msg" id="chatIdErr">من فضلك اكتب اسمك وبريد إلكتروني صحيح</div>
        <button class="btn btn-primary" onclick="submitChatIdentity()">بدء المحادثة</button>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <header class="app-head">
      ${starSVG}
      <h1>راسل المعلم</h1>
      <div class="divider"></div>
      <button class="btn btn-outline btn-sm" onclick="goStudentChatBack()">رجوع للمواعيد</button>
    </header>
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessagesBox">
        ${state.chatMessages === null ? '<div class="chat-empty">جارٍ التحميل...</div>' : chatBubblesHtml(state.chatMessages, 'student')}
      </div>
      <div class="chat-input-row">
        <input id="chatInputStudent" type="text" placeholder="اكتب رسالتك...">
        <button class="btn btn-primary btn-sm" onclick="sendStudentMessage()">إرسال</button>
      </div>
    </div>
  `;
  const box = document.getElementById('chatMessagesBox');
  if(box) box.scrollTop = box.scrollHeight;
  const input = document.getElementById('chatInputStudent');
  if(input){
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') sendStudentMessage(); });
  }
}

/* ---------------- CHAT: جانب المعلم ---------------- */
function startAdminChatList(){
  if(chatListUnsub) return;
  chatListUnsub = db.collection(CHATS_COLLECTION).orderBy('lastMessageAt', 'desc').onSnapshot((snap)=>{
    state.chatList = snap.docs.map(d=>({ id: d.id, ...d.data() }));
    state.chatUnreadTotal = state.chatList.filter(c=>c.unreadByTeacher).length;
    if(state.view === 'admin' || state.view === 'adminChats') render();
  }, ()=>{});
}

function goAdminChats(){
  state.view = 'adminChats';
  render();
}
function goBackFromAdminChats(){
  state.view = 'admin';
  render();
}

function openAdminChatThread(email){
  stopChatThread();
  state.activeChatEmail = email;
  const known = state.chatList.find(c=>c.id === email);
  state.activeChatName = (known && known.studentName) || email;
  state.activeChatMessages = (known && known.messages) || [];
  state.view = 'adminChatThread';
  render();

  const docRef = db.collection(CHATS_COLLECTION).doc(email);
  chatThreadUnsub = docRef.onSnapshot((doc)=>{
    const d = doc.exists ? doc.data() : {};
    state.activeChatMessages = d.messages || [];
    state.activeChatName = d.studentName || email;
    if(d.unreadByTeacher){
      docRef.set({ unreadByTeacher: false }, { merge:true }).catch(()=>{});
    }
    if(state.view === 'adminChatThread') render();
  }, ()=>{});
}

function goBackFromChatThread(){
  stopChatThread();
  state.view = 'adminChats';
  render();
}

async function deleteWholeChat(email){
  if(!confirm('هل أنت متأكد من حذف المحادثة بالكامل مع هذا الطالب؟ لا يمكن التراجع.')) return;
  try{
    await db.collection(CHATS_COLLECTION).doc(email).delete();
    showToast('تم حذف المحادثة');
  }catch(e){
    showToast('تعذر حذف المحادثة، حاول تاني');
    return;
  }
  if(state.activeChatEmail === email){
    goBackFromChatThread();
  }
}

function sendTeacherMessage(){
  const input = document.getElementById('chatInputTeacher');
  const text = input.value.trim();
  if(!text || !state.activeChatEmail) return;
  const msg = { id: uid(), from:'teacher', text, at: new Date().toISOString() };
  db.collection(CHATS_COLLECTION).doc(state.activeChatEmail).set({
    messages: firebase.firestore.FieldValue.arrayUnion(msg),
    lastMessageAt: msg.at,
    lastMessageFrom: 'teacher',
    lastMessageText: text,
    unreadByStudent: true,
    unreadByTeacher: false
  }, { merge:true }).catch(()=>{ showToast('تعذر إرسال الرسالة، حاول تاني'); });
  input.value = '';
}

function deleteTeacherMessage(msgId){
  if(!confirm('حذف الرسالة دي؟')) return;
  const filtered = (state.activeChatMessages || []).filter(m=>m.id !== msgId);
  const last = filtered[filtered.length - 1];
  db.collection(CHATS_COLLECTION).doc(state.activeChatEmail).set({
    messages: filtered,
    lastMessageAt: last ? last.at : new Date().toISOString(),
    lastMessageFrom: last ? last.from : null,
    lastMessageText: last ? last.text : ''
  }, { merge:true }).catch(()=>{ showToast('تعذر حذف الرسالة'); });
}

function renderAdminChatList(app){
  const list = state.chatList || [];
  const rows = list.length ? list.map(c=>`
    <div class="chat-list-item" onclick="openAdminChatThread('${escapeAttr(c.id)}')">
      <div style="flex:1; min-width:0;">
        <div class="cl-name">${escapeHtml(c.studentName || c.id)}</div>
        <div class="cl-preview">${escapeHtml((c.lastMessageFrom === 'teacher' ? 'أنت: ' : '') + (c.lastMessageText || ''))}</div>
      </div>
      ${c.unreadByTeacher ? '<span class="unread-dot"></span>' : ''}
    </div>
  `).join('') : `<div class="empty-state"><div>لا توجد رسائل بعد</div></div>`;

  app.innerHTML = `
    <div class="admin-topbar">
      <h2>الرسائل</h2>
      <button class="btn btn-outline btn-sm" onclick="goBackFromAdminChats()">رجوع للوحة المعلم</button>
    </div>
    ${rows}
  `;
}

function renderAdminChatThread(app){
  app.innerHTML = `
    <div class="admin-topbar">
      <h2>${escapeHtml(state.activeChatName)}</h2>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-danger btn-sm" onclick="deleteWholeChat('${escapeAttr(state.activeChatEmail)}')">حذف المحادثة بالكامل</button>
        <button class="btn btn-outline btn-sm" onclick="goBackFromChatThread()">رجوع للرسائل</button>
      </div>
    </div>
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessagesBoxAdmin">
        ${chatBubblesHtml(state.activeChatMessages, 'teacher')}
      </div>
      <div class="chat-input-row">
        <input id="chatInputTeacher" type="text" placeholder="اكتب ردك...">
        <button class="btn btn-primary btn-sm" onclick="sendTeacherMessage()">إرسال</button>
      </div>
    </div>
  `;
  const box = document.getElementById('chatMessagesBoxAdmin');
  if(box) box.scrollTop = box.scrollHeight;
  const input = document.getElementById('chatInputTeacher');
  if(input){
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') sendTeacherMessage(); });
  }
}

async function createAdminPin(){
  const p1 = document.getElementById('pinField1').value.trim();
  const p2 = document.getElementById('pinField2').value.trim();
  const err = document.getElementById('setupErr');
  if(p1.length < 4 || p1 !== p2){
    err.style.display = 'block';
    return;
  }
  state.data.pin = p1;
  await saveData();
  state.view = 'admin';
  render();
  startAdminChatList();
  showToast('تم إنشاء رمز الدخول بنجاح');
}

function goChangePin(){
  state.view = 'adminChangePin';
  render();
}
function backToAdmin(){
  state.view = 'admin';
  render();
}
async function saveNewPin(){
  const cur = document.getElementById('curPin').value.trim();
  const p1 = document.getElementById('newPin1').value.trim();
  const p2 = document.getElementById('newPin2').value.trim();
  const err = document.getElementById('changePinErr');
  if(cur !== state.data.pin || p1.length < 4 || p1 !== p2){
    err.style.display = 'block';
    return;
  }
  state.data.pin = p1;
  await saveData();
  state.view = 'admin';
  render();
  showToast('تم تغيير كلمة السر بنجاح');
}

function tryAdminLogin(){
  const val = document.getElementById('pinField').value.trim();
  if(val === state.data.pin){
    state.view = 'admin';
    state.pinAttemptError = false;
    render();
    startAdminChatList();
  }else{
    state.pinAttemptError = true;
    render();
  }
}

function openBooking(slotId){
  state.selectedSlot = slotId;
  render();
}
function closeBooking(){
  state.selectedSlot = null;
  render();
}
function closeBookingOnBackdrop(e){
  if(e.target.classList.contains('modal-backdrop')) closeBooking();
}

async function confirmBooking(){
  const name = document.getElementById('stName').value.trim();
  const email = document.getElementById('stEmail').value.trim().toLowerCase();
  const phone = document.getElementById('stPhone').value.trim();
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!name || !emailOk){
    document.getElementById('bookErr').style.display = 'block';
    return;
  }
  // refresh first to avoid double-booking race
  await refreshFromServer(true);
  const s = state.data.slots.find(x=>x.id===state.selectedSlot);
  if(!s){
    showToast('عذرًا، هذا الميعاد لم يعد موجودًا');
    state.selectedSlot = null;
    render();
    return;
  }
  s.bookings = s.bookings || [];
  if(s.bookings.length >= MAX_SEATS){
    showToast('عذرًا، اكتمل هذا الميعاد بالفعل');
    state.selectedSlot = null;
    render();
    return;
  }
  s.bookings.push({ id: uid(), name, email, phone, at: new Date().toISOString() });
  await saveData();
  try{ localStorage.setItem('meqraaMyEmail', email); }catch(e){}
  state.lastBooking = { date: s.date, time: s.time, name };
  state.selectedSlot = null;
  state.view = 'confirm';
  render();
}

function defaultNotifyMessage(slot){
  const link = window.location.origin + window.location.pathname;
  if(slot){
    return `مرحبًا 👋\nتم إضافة ميعاد جديد في ${state.data.info.name || 'المقرأة'}:\n${fmtDate(slot.date)} - ${fmtTime(slot.time)}\n\nاحجز مكانك من هنا:\n${link}`;
  }
  return `مرحبًا 👋\nفيه مواعيد جديدة متاحة في ${state.data.info.name || 'المقرأة'}.\nاحجز مكانك من هنا:\n${link}`;
}

function getKnownStudents(){
  const map = new Map();
  (state.data.slots || []).forEach(s=>{
    (s.bookings || []).forEach(b=>{
      const phone = (b.phone || '').trim();
      if(phone && !map.has(phone)){
        map.set(phone, { name: b.name, phone });
      }
    });
  });
  return Array.from(map.values()).sort((a,b)=> a.name.localeCompare(b.name, 'ar'));
}

function normalizePhoneForWhatsApp(phone){
  let digits = (phone || '').replace(/\D/g, '');
  if(digits.startsWith('00')){
    digits = digits.slice(2);
  }else if(digits.startsWith('0') && digits.length === 11){
    digits = '2' + digits; // رقم مصري محلي 01xxxxxxxxx -> 201xxxxxxxxx (كود +20)
  }
  return digits;
}

function sendWhatsApp(phone){
  const box = document.getElementById('notifyMessageBox');
  const text = box ? box.value : state.notifyMessage;
  const num = normalizePhoneForWhatsApp(phone);
  const url = 'https://wa.me/' + num + '?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

function goAdminNotify(prefillMessage){
  state.notifyMessage = prefillMessage || defaultNotifyMessage(null);
  state.view = 'adminNotify';
  render();
}
function goBackFromAdminNotify(){
  state.view = 'admin';
  render();
}

function renderAdminNotify(app){
  const students = getKnownStudents();
  app.innerHTML = `
    <div class="admin-topbar">
      <h2>إشعار واتساب للطلاب</h2>
      <button class="btn btn-outline btn-sm" onclick="goBackFromAdminNotify()">رجوع للوحة المعلم</button>
    </div>
    <div class="admin-card">
      <div class="field" style="margin-bottom:10px;">
        <label>نص الرسالة (تقدر تعدّلها)</label>
        <textarea id="notifyMessageBox" rows="5" style="width:100%; font-family:inherit; font-size:0.88rem; padding:9px 10px; border:1px solid var(--paper-deep); border-radius:8px; resize:vertical;">${escapeHtml(state.notifyMessage)}</textarea>
      </div>
      <button class="btn btn-outline btn-sm" onclick="copyNotifyMessage()">📋 نسخ الرسالة (للصقها في جروب الواتساب)</button>
    </div>
    <div class="section-title">أرسل لكل طالب لوحده (${students.length})</div>
    ${students.length ? `
      <button class="btn btn-outline btn-sm" style="margin-bottom:10px;" onclick="copyAllNumbers()">📋 نسخ كل الأرقام (لعمل قائمة بث)</button>
      <div class="admin-card">${students.map(s=>`
      <div class="roster-item" style="margin-bottom:8px;">
        <span class="roster-info"><span class="name">${escapeHtml(s.name)}</span> — ${escapeHtml(s.phone)}</span>
        <button class="btn btn-primary btn-sm" onclick="sendWhatsApp('${escapeAttr(s.phone)}')">📲 واتساب</button>
      </div>
    `).join('')}</div>` : '<div class="empty-state"><div>لا يوجد طلاب لديهم رقم هاتف مسجل بعد</div></div>'}
    <p style="font-size:0.78rem; color:var(--ink-soft); margin-top:14px; text-align:center;">
      هتفتح واتساب لكل طالب لوحده برسالة جاهزة — تدوس إرسال يدويًا في كل مرة.
    </p>
  `;
}

function copyNotifyMessage(){
  const box = document.getElementById('notifyMessageBox');
  const text = box ? box.value : state.notifyMessage;
  navigator.clipboard.writeText(text).then(()=>{
    showToast('تم نسخ الرسالة، افتح واتساب والصقها');
  }).catch(()=>{
    showToast('تعذر النسخ التلقائي، انسخ النص يدويًا من الصندوق');
  });
}

function copyAllNumbers(){
  const students = getKnownStudents();
  const text = students.map(s=> s.name + ': ' + s.phone).join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    showToast('تم نسخ كل الأرقام');
  }).catch(()=>{
    showToast('تعذر النسخ التلقائي');
  });
}

async function addSlot(){
  const date = document.getElementById('newDate').value;
  const time = document.getElementById('newTime').value;
  const note = document.getElementById('newNote').value.trim();
  if(!date || !time){
    document.getElementById('addErr').style.display = 'block';
    return;
  }
  const newSlot = { id: uid(), date, time, duration: SLOT_MINUTES, note, bookings: [] };
  state.data.slots.push(newSlot);
  await saveData();
  showToast('تم إضافة الميعاد');
  goAdminNotify(defaultNotifyMessage(newSlot));
}

async function deleteSlot(id){
  state.data.slots = state.data.slots.filter(s=>s.id!==id);
  await saveData();
  render();
  showToast('تم حذف الميعاد');
}

async function cancelBooking(slotId, bookingId){
  const s = state.data.slots.find(x=>x.id===slotId);
  if(s){ s.bookings = (s.bookings||[]).filter(b=>b.id!==bookingId); }
  await saveData();
  render();
  showToast('تم إلغاء الحجز');
}

async function saveInfo(){
  state.data.info.name = document.getElementById('infoName').value.trim() || 'المقرأة';
  state.data.info.desc = document.getElementById('infoDesc').value.trim();
  await saveData();
  showToast('تم حفظ البيانات');
}

async function refreshFromServer(silent){
  if(!db) return;
  try{
    const snap = await db.collection(FIRESTORE_COLLECTION).doc(FIRESTORE_DOC).get();
    if(snap.exists){
      state.data = snap.data();
      if(!silent && (state.view==='student')) render();
    }
  }catch(e){ /* ignore */ }
}

document.addEventListener('click', (e)=>{
  if(state.adminMenuOpen && !e.target.closest('.admin-menu-wrap')){
    state.adminMenuOpen = false;
    render();
  }
});

window.addEventListener('hashchange', ()=>{
  if(window.location.hash === TEACHER_HASH && state.view === 'student'){
    goAdminEntry();
  }
});

/* التحديث بين الأجهزة بيحصل فورًا عن طريق Firestore onSnapshot في loadData()،
   بس بنعمل تحديث إضافي وقت الرجوع للصفحة كإجراء احتياطي */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshFromServer(true).then(render); });

loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
